<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Notepad</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-hover: #eef0f3;
            --border: #d9dde3;
            --text: #20242a;
            --muted: #6b7280;
            --accent: #1769aa;
            --accent-hover: #0f578f;
            --danger: #b42318;
            --editor-font: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #17191d;
            --surface: #202328;
            --surface-hover: #2b2f35;
            --border: #383d45;
            --text: #f0f2f4;
            --muted: #a2a9b3;
            --accent: #59a8e8;
            --accent-hover: #78b9ec;
            --danger: #ff8a80;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            min-height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
            margin-right: 8px;
            font-weight: 700;
        }

        .brand svg {
            flex: 0 0 auto;
            color: var(--accent);
        }

        #note-title {
            width: min(300px, 30vw);
            min-width: 130px;
            padding: 7px 9px;
            border: 1px solid transparent;
            border-radius: 5px;
            outline: none;
            background: transparent;
            color: var(--text);
            font-weight: 600;
        }

        #note-title:hover,
        #note-title:focus {
            border-color: var(--border);
            background: var(--bg);
        }

        .toolbar-spacer {
            flex: 1;
        }

        .tool-button {
            display: inline-grid;
            place-items: center;
            width: 36px;
            height: 36px;
            flex: 0 0 36px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .tool-button:hover {
            background: var(--surface-hover);
        }

        .tool-button:focus-visible,
        #note-title:focus-visible,
        #editor:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .tool-button.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .editor-shell {
            min-height: 0;
            padding: clamp(12px, 3vw, 34px);
        }

        #editor {
            display: block;
            width: min(100%, 1080px);
            height: 100%;
            min-height: 220px;
            margin: 0 auto;
            resize: none;
            padding: clamp(18px, 4vw, 42px);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-family: var(--editor-font);
            font-size: 16px;
            line-height: 1.7;
            letter-spacing: 0;
            tab-size: 4;
            box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
        }

        #editor::placeholder {
            color: var(--muted);
        }

        .statusbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 34px;
            padding: 6px 14px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-size: 12px;
        }

        .counts {
            display: flex;
            gap: 14px;
            white-space: nowrap;
        }

        @media (max-width: 620px) {
            .toolbar {
                flex-wrap: wrap;
            }

            .brand {
                width: 100%;
            }

            #note-title {
                width: 100%;
            }

            .toolbar-spacer {
                display: none;
            }

            .editor-shell {
                padding: 0;
            }

            #editor {
                border: 0;
                border-radius: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <header class="toolbar" aria-label="Notepad toolbar">
        <div class="brand">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6M8 13h8M8 17h8M8 9h2" />
            </svg>
            <input id="note-title" type="text" value="Untitled note" aria-label="Note title" maxlength="80"
                spellcheck="false">
        </div>

        <div class="toolbar-spacer"></div>

        <button id="new-button" class="tool-button danger" type="button" aria-label="Create new note" title="New note">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14" />
            </svg>
        </button>

        <button id="download-button" class="tool-button" type="button" aria-label="Download note" title="Download note">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
            </svg>
        </button>

        <button id="theme-button" class="tool-button" type="button" aria-label="Switch theme" title="Switch theme">
            <svg id="theme-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
            </svg>
        </button>
    </header>

    <main class="editor-shell">
        <textarea id="editor" aria-label="Note text" placeholder="Start typing..." autofocus
            spellcheck="true"></textarea>
    </main>

    <footer class="statusbar">
        <span id="save-status" role="status" aria-live="polite">Saved locally</span>
        <div class="counts">
            <span id="word-count">0 words</span>
            <span id="character-count">0 characters</span>
        </div>
    </footer>

    <script>
        const STORAGE_KEY = "standalone-notepad-note";
        const THEME_KEY = "standalone-notepad-theme";
        const editor = document.querySelector("#editor");
        const titleInput = document.querySelector("#note-title");
        const saveStatus = document.querySelector("#save-status");
        const wordCount = document.querySelector("#word-count");
        const characterCount = document.querySelector("#character-count");
        const themeButton = document.querySelector("#theme-button");
        let saveTimer;

        function updateCounts() {
            const text = editor.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCount.textContent = `${words} ${words === 1 ? "word" : "words"}`;
            characterCount.textContent = `${text.length} ${text.length === 1 ? "character" : "characters"}`;
        }

        function saveNote() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                title: titleInput.value,
                content: editor.value
            }));
            saveStatus.textContent = "Saved locally";
        }

        function scheduleSave() {
            saveStatus.textContent = "Saving...";
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveNote, 350);
            updateCounts();
        }

        function loadNote() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (saved) {
                    titleInput.value = saved.title || "Untitled note";
                    editor.value = saved.content || "";
                }
            } catch {
                localStorage.removeItem(STORAGE_KEY);
            }
            updateCounts();
        }

        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem(THEME_KEY, theme);
            themeButton.setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} theme`);
            themeButton.title = `Switch to ${theme === "dark" ? "light" : "dark"} theme`;
        }

        editor.addEventListener("input", scheduleSave);
        titleInput.addEventListener("input", scheduleSave);

        editor.addEventListener("keydown", (event) => {
            if (event.key === "Tab") {
                event.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.setRangeText("    ", start, end, "end");
                scheduleSave();
            }

            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
                event.preventDefault();
                clearTimeout(saveTimer);
                saveNote();
            }
        });

        document.querySelector("#new-button").addEventListener("click", () => {
            if ((editor.value || titleInput.value !== "Untitled note") && !window.confirm("Clear the current note and start a new one?")) {
                return;
            }
            titleInput.value = "Untitled note";
            editor.value = "";
            saveNote();
            updateCounts();
            editor.focus();
        });

        document.querySelector("#download-button").addEventListener("click", () => {
            const safeTitle = (titleInput.value.trim() || "note").replace(/[<>:\"/\\|?*]+/g, "-");
            const blob = new Blob([editor.value], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${safeTitle}.txt`;
            link.click();
            URL.revokeObjectURL(url);
        });

        themeButton.addEventListener("click", () => {
            setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
        });

        const preferredTheme = localStorage.getItem(THEME_KEY)
            || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        setTheme(preferredTheme);
        loadNote();
    </script>
</body>

</html>
